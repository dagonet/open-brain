name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run

  web:
    name: Web Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run
      # The build needs no real credentials: nothing is fetched at build time and the
      # server-only keys are read at request time. The two public vars are inlined into
      # the bundle, so they are set to obvious placeholders to keep the build self-contained.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: 1

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      # --node-modules-dir=none: the repo-root package.json would otherwise make Deno
      # resolve npm types from a node_modules dir the edge functions do not use.
      - run: deno check --node-modules-dir=none supabase/functions/compile-wiki/index.ts supabase/functions/detect-contradictions/index.ts supabase/functions/run-nightly-jobs/index.ts supabase/functions/tasks-feed/index.ts
      - run: deno test --node-modules-dir=none --allow-env supabase/functions/handler-auth_test.ts supabase/functions/tasks-feed_test.ts

  format-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --check .
      - run: npm ci
        working-directory: cli
      - run: npx eslint .
        working-directory: cli
      - run: npm ci
        working-directory: mcp-server
      - run: npx eslint .
        working-directory: mcp-server
      - run: npm ci
        working-directory: web
      - run: npx eslint .
        working-directory: web
